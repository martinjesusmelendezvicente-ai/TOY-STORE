<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contacto - Mundo Juguete</title>
    <link rel="stylesheet" href="css/estilos.css">
</head>
<body>
    <header>
        <div class="container header-flex">
            <div class="logo">
                <img src="logo.jpg" alt="Logo de TOYS" class="logo-img">
                <h1>Mundo Juguete</h1>
            </div>
            <nav>
                <ul class="nav-menu">
                    <li><a href="index.html">Inicio</a></li>
                    <li><a href="productos.html">Juguetes</a></li>
                    <li><a href="contacto.html">Contacto</a></li>
                </ul>
            </nav>
        </div>
    </header>

    <main>
        <section class="contacto-section">
            <div class="container">
                <h2>Escríbenos</h2>
                <form action="#" method="post" class="contacto-form">
                    <div class="form-group">
                        <label for="nombre">Nombre completo:</label>
                        <input type="text" id="nombre" name="nombre" required placeholder="Tu nombre">
                    </div>
                    <div class="form-group">
                        <label for="email">Correo electrónico:</label>
                        <input type="email" id="email" name="email" required placeholder="tu@email.com">
                    </div>
                    <div class="form-group">
                        <label for="mensaje">Mensaje:</label>
                        <textarea id="mensaje" name="mensaje" rows="5" required placeholder="¿Qué juguete te interesa? Cuéntanos..."></textarea>
                    </div>
                    <button type="submit" class="btn">Enviar consulta</button>
                </form>
            </div>
        </section>
    </main>

    <footer>
        <div class="container">
            <div class="footer-info">
                <p>© 2026 Mundo Juguete - Todos los derechos reservados</p>
                <p>📍 Cañete, Local 34 - WhatsApp: +51 999 777 888</p>
                <p>📧 contacto@mundojuguete.com</p>
            </div>
        </div>
    </footer>
</body>
</html>
